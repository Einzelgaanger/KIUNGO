services:
  - type: web
    name: kiungo
    runtime: node
    plan: free
    buildCommand: npx pnpm@9.15.9 install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kiungo.onrender.com
      - key: NODE_VERSION
        value: "20"
